server:
  port: 8080

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: command-service-v1
          uri: lb://command-service
          predicates:
            - Path=/api/v1/commands/**

        - id: command-service-devices
          uri: lb://command-service
          predicates:
            - Path=/api/v1/devices/**

        - id: command-service-runs
          uri: lb://command-service
          predicates:
            - Path=/api/v1/runs/**

        - id: command-service-platforms
          uri: lb://command-service
          predicates:
            - Path=/api/v1/platforms/**

        - id: price-service-naver
          uri: lb://price-service
          predicates:
            - Path=/api/v1/naver/**

        - id: price-service-aliexpress
          uri: lb://price-service
          predicates:
            - Path=/api/v1/aliexpress/**

        - id: price-service-monitoring
          uri: lb://price-service
          predicates:
            - Path=/api/v1/monitoring/**

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notification/**

        # ─── Swagger UI 라우팅 (개발용) ──────────────────────
        - id: auth-service-swagger
          uri: lb://auth-service
          predicates:
            - Path=/auth-service/swagger-ui.html, /auth-service/swagger-ui/**, /auth-service/v3/api-docs/**
          filters:
            - StripPrefix=1

        - id: command-service-swagger
          uri: lb://command-service
          predicates:
            - Path=/command-service/swagger-ui.html, /command-service/swagger-ui/**, /command-service/v3/api-docs/**
          filters:
            - StripPrefix=1

        - id: price-service-swagger
          uri: lb://price-service
          predicates:
            - Path=/price-service/swagger-ui.html, /price-service/swagger-ui/**, /price-service/v3/api-docs/**
          filters:
            - StripPrefix=1

        - id: payment-service-swagger
          uri: lb://payment-service
          predicates:
            - Path=/payment-service/swagger-ui.html, /payment-service/swagger-ui/**, /payment-service/v3/api-docs/**
          filters:
            - StripPrefix=1

        - id: notification-service-swagger
          uri: lb://notification-service
          predicates:
            - Path=/notification-service/swagger-ui.html, /notification-service/swagger-ui/**, /notification-service/v3/api-docs/**
          filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    org.springframework.cloud.gateway: INFO

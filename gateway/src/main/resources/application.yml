server:
  port: 8080

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: command-service-v1
          uri: lb://command-service
          predicates:
            - Path=/api/v1/commands/**

        - id: command-service-devices
          uri: lb://command-service
          predicates:
            - Path=/api/v1/devices/**

        - id: command-service-runs
          uri: lb://command-service
          predicates:
            - Path=/api/v1/runs/**

        - id: command-service-platforms
          uri: lb://command-service
          predicates:
            - Path=/api/v1/platforms/**

        - id: price-service-naver
          uri: lb://price-service
          predicates:
            - Path=/api/v1/naver/**

        - id: price-service-aliexpress
          uri: lb://price-service
          predicates:
            - Path=/api/v1/aliexpress/**

        - id: price-service-monitoring
          uri: lb://price-service
          predicates:
            - Path=/api/v1/monitoring/**

        - id: price-service-url-monitoring
          uri: lb://price-service
          predicates:
            - Path=/api/v1/url-monitoring/**

        - id: price-service-browser-search
          uri: lb://price-service
          predicates:
            - Path=/api/v1/browser-search/**

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**, /api/v1/wallet/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

        # ─── Swagger UI 라우팅 (개발용) ──────────────────────
        - id: auth-service-swagger-ui
          uri: lb://auth-service
          predicates:
            - Path=/auth-service/swagger-ui/**
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Forwarded-Prefix, /auth-service
        - id: auth-service-swagger-html
          uri: lb://auth-service
          predicates:
            - Path=/auth-service/swagger-ui.html
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Forwarded-Prefix, /auth-service
        - id: auth-service-api-docs
          uri: lb://auth-service
          predicates:
            - Path=/auth-service/v3/api-docs/**
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Forwarded-Prefix, /auth-service

        - id: command-service-swagger-ui
          uri: lb://command-service
          predicates:
            - Path=/command-service/swagger-ui/**
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Forwarded-Prefix, /command-service
        - id: command-service-swagger-html
          uri: lb://command-service
          predicates:
            - Path=/command-service/swagger-ui.html
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Forwarded-Prefix, /command-service
        - id: command-service-api-docs
          uri: lb://command-service
          predicates:
            - Path=/command-service/v3/api-docs/**
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Forwarded-Prefix, /command-service

        - id: price-service-swagger-ui
          uri: lb://price-service
          predicates:
            - Path=/price-service/swagger-ui/**
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Forwarded-Prefix, /price-service
        - id: price-service-swagger-html
          uri: lb://price-service
          predicates:
            - Path=/price-service/swagger-ui.html
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Forwarded-Prefix, /price-service
        - id: price-service-api-docs
          uri: lb://price-service
          predicates:
            - Path=/price-service/v3/api-docs/**
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Forwarded-Prefix, /price-service

        - id: payment-service-swagger-ui
          uri: lb://payment-service
          predicates:
            - Path=/payment-service/swagger-ui/**
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Forwarded-Prefix, /payment-service
        - id: payment-service-swagger-html
          uri: lb://payment-service
          predicates:
            - Path=/payment-service/swagger-ui.html
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Forwarded-Prefix, /payment-service
        - id: payment-service-api-docs
          uri: lb://payment-service
          predicates:
            - Path=/payment-service/v3/api-docs/**
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Forwarded-Prefix, /payment-service

        - id: notification-service-swagger-ui
          uri: lb://notification-service
          predicates:
            - Path=/notification-service/swagger-ui/**
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Forwarded-Prefix, /notification-service
        - id: notification-service-swagger-html
          uri: lb://notification-service
          predicates:
            - Path=/notification-service/swagger-ui.html
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Forwarded-Prefix, /notification-service
        - id: notification-service-api-docs
          uri: lb://notification-service
          predicates:
            - Path=/notification-service/v3/api-docs/**
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Forwarded-Prefix, /notification-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.springframework.cloud.gateway: INFO

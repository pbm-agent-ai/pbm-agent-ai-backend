server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # 테스트에서는 Kafka 자동 설정을 비활성화하여 실제 브로커 연결을 피한다
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

  cloud:
    discovery:
      enabled: false

app:
  kafka:
    topics:
      user-event: user-event

jwt:
  secret: test-secret-key-for-jwt-testing-must-be-at-least-256-bits-long
  expiration: 3600000
  refresh-expiration: 604800000

eureka:
  client:
    enabled: false

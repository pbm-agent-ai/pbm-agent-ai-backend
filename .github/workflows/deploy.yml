name: CI/CD - Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ─────────────────────────────────────────────
  # Job 1: 테스트
  # ─────────────────────────────────────────────
  test:
    name: 테스트
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: 테스트 실행
        run: ./gradlew test --continue
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: 테스트 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/'

  # ─────────────────────────────────────────────
  # Job 2: 빌드 & 도커 이미지 push
  # (main 브랜치 push 시에만 실행)
  # ─────────────────────────────────────────────
  build-and-push:
    name: 빌드 & 이미지 Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: auth-service 이미지 빌드 & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: auth-service/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/pbm-auth-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: command-service 이미지 빌드 & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: command-service/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/pbm-command-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: price-service 이미지 빌드 & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: price-service/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/pbm-price-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: payment-service 이미지 빌드 & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: payment-service/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/pbm-payment-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: notification-service 이미지 빌드 & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: notification-service/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/pbm-notification-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: gateway 이미지 빌드 & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/pbm-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Job 3: KT Cloud 서버 배포
  # ─────────────────────────────────────────────
  deploy:
    name: KT Cloud 배포
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: KT Cloud 서버에 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.KT_SERVER_HOST }}
          username: ${{ secrets.KT_SERVER_USER }}
          key: ${{ secrets.KT_SERVER_SSH_KEY }}
          envs: DOCKERHUB_USERNAME
          script: |
            cd ~/pbm-agent-ai-backend

            # 최신 코드 pull (docker-compose.prod.yml 변경사항 반영)
            git pull origin main

            # 최신 이미지 pull
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} \
            docker compose -f docker-compose.prod.yml pull

            # 인프라(postgres, redis, kafka)는 유지하고 앱 서비스만 재시작
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} \
            docker compose -f docker-compose.prod.yml up -d --no-deps \
              eureka-server \
              gateway \
              auth-service \
              command-service \
              price-service \
              payment-service \
              notification-service \
              external-api-service

            # 오래된 이미지 정리
            docker image prune -f

            echo "✅ 배포 완료 - $(date)"

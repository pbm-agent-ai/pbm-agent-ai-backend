server:
  forward-headers-strategy: framework
  port: 8084

spring:
  application:
    name: payment-service
  sql:
    init:
      mode: always

  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: payment-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        # 발행 측(price-service) 클래스명이 헤더에 담겨오지만 payment-service에 없으므로 헤더 무시
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.pbm.payment.dto.event.PaymentRequestEvent
        # 블록체인 트랜잭션 대기(최대 5분) 동안 컨슈머가 그룹에서 제외되지 않도록 여유를 줌
        max.poll.interval.ms: 600000
        session.timeout.ms: 60000
        heartbeat.interval.ms: 10000

app:
  kafka:
    topics:
      payment-topic: payment-topic
      payment-result: payment-result
      session-key-registration: session-key-registration
      subscription-termination: subscription-termination

app.session-key.expiry-check-interval-ms: 3600000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# 블록체인(Sepolia 테스트넷) 연동 설정
blockchain:
  # Alchemy Sepolia RPC URL
  rpc-url: ${SEPOLIA_RPC_URL:https://eth-sepolia.g.alchemy.com/v2/your-api-key}
  # Primary RPC에만 pending tx가 남는 경우를 진단/복구하기 위한 fallback RPC
  fallback-rpc-url: ${SEPOLIA_FALLBACK_RPC_URL:https://ethereum-sepolia-rpc.publicnode.com}
  # AI 에이전트 개인키 (트랜잭션 서명용, 절대 하드코딩 금지)
  private-key: ${BLOCKCHAIN_PRIVATE_KEY}
  # 컨트랙트 주소
  contract:
    account-factory: ${CONTRACT_ACCOUNT_FACTORY:0x6477a82Ba2C7a02c3D59f4253347A0b9d82FC290}
    pbm-token: ${CONTRACT_PBM_TOKEN:0xB409DD3e4500f0A8E3cAca67abDec41Fc8E962Ca}
    paymaster: ${CONTRACT_PAYMASTER:0xf0E64F414640A8a4df285FF20C40c73798b33ccA}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    # Kafka 연결 재시도 로그 억제 (로컬 개발 환경에서 Kafka 없을 때)
    org.apache.kafka.clients.NetworkClient: ERROR
    org.apache.kafka.clients: WARN
    # 리스너 에러는 확인할 수 있도록 INFO 유지
    org.springframework.kafka: INFO
    org.springframework.kafka.listener: ERROR

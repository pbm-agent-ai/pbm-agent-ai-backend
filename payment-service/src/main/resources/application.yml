server:
  forward-headers-strategy: framework
  port: 8084

spring:
  application:
    name: payment-service

  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: payment-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        # 발행 측(price-service) 클래스명이 헤더에 담겨오지만 payment-service에 없으므로 헤더 무시
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.pbm.payment.dto.event.PaymentRequestEvent

app:
  kafka:
    topics:
      payment-topic: payment-topic
      payment-result: payment-result

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# 블록체인(Sepolia 테스트넷) 연동 설정
blockchain:
  # Alchemy Sepolia RPC URL
  rpc-url: ${SEPOLIA_RPC_URL:https://eth-sepolia.g.alchemy.com/v2/your-api-key}
  # AI 에이전트 개인키 (트랜잭션 서명용, 절대 하드코딩 금지)
  private-key: ${BLOCKCHAIN_PRIVATE_KEY}
  # 컨트랙트 주소
  contract:
    account-factory: ${CONTRACT_ACCOUNT_FACTORY:0x6477a82Ba2C7a02c3D59f4253347A0b9d82FC290}
    pbm-token: ${CONTRACT_PBM_TOKEN:0x810C61F02649b910250DB083a2cDc470cDa977c0}
    paymaster: ${CONTRACT_PAYMASTER:0xc6e25230E03378ecc5398E3De4EC444B98bBB032}

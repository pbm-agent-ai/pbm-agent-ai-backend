services:
  # ─── 인프라 ────────────────────────────────────────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-password}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # 컨테이너 간 통신(INTERNAL) + 로컬 개발(EXTERNAL) 모두 지원
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CREATE_TOPICS: "user-event:1:1,price-topic:1:1,price-alert:1:1,payment-topic:1:1,payment-result:1:1,session-key-registration:1:1"

  # ─── 모니터링 ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - eureka-server

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  # ─── 서비스 디스커버리 ────────────────────────────────────
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=default

  # ─── API 게이트웨이 ───────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    env_file:
      - .env
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/

  # ─── 인증 서비스 ──────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - redis
      - eureka-server
    env_file:
      - .env
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - AUTH_DB_URL=jdbc:postgresql://postgres:5432/auth_db
      - AUTH_DB_USERNAME=${AUTH_DB_USERNAME:-postgres}
      - AUTH_DB_PASSWORD=${AUTH_DB_PASSWORD:-password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_EXPIRATION=${JWT_EXPIRATION:-1800000}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-604800000}

  # ─── 커맨드 서비스 ────────────────────────────────────────
  command-service:
    build:
      context: .
      dockerfile: command-service/Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      - kafka
      - eureka-server
      - redis
    env_file:
      - .env
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EXTERNAL_API_SERVICE_URL=http://external-api-service:8090
      - COMMAND_DB_URL=jdbc:postgresql://postgres:5432/command_db
      - COMMAND_DB_USERNAME=${COMMAND_DB_USERNAME:-postgres}
      - COMMAND_DB_PASSWORD=${COMMAND_DB_PASSWORD:-password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_DEVICE_EXPIRATION=${JWT_DEVICE_EXPIRATION:-2592000000}
      - JWT_AGENT_EXPIRATION=${JWT_AGENT_EXPIRATION:-1800000}

  # ─── 가격 서비스 ──────────────────────────────────────────
  price-service:
    build:
      context: .
      dockerfile: price-service/Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - eureka-server
      - external-api-service
    env_file:
      - .env
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EXTERNAL_API_SERVICE_URL=http://external-api-service:8090
      - PRICE_DB_URL=jdbc:postgresql://postgres:5432/price_db
      - PRICE_DB_USERNAME=${PRICE_DB_USERNAME:-postgres}
      - PRICE_DB_PASSWORD=${PRICE_DB_PASSWORD:-password}
      - PAYMENT_SERVICE_URL=http://payment-service:8084

  # ─── 결제 서비스 ──────────────────────────────────────────
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "8084:8084"
    depends_on:
      - kafka
      - eureka-server
    env_file:
      - .env
    environment:
      # 도커 내부 네트워크 주소 (호스트 환경변수보다 이 값이 우선 적용됨)
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PAYMENT_DB_URL=jdbc:postgresql://postgres:5432/payment_db
      - PAYMENT_DB_USERNAME=${PAYMENT_DB_USERNAME:-postgres}
      - PAYMENT_DB_PASSWORD=${PAYMENT_DB_PASSWORD:-password}

  # ─── 알림 서비스 ──────────────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8085:8085"
    depends_on:
      - kafka
      - eureka-server
      - postgres
    env_file:
      - .env
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - NOTIFICATION_DB_URL=jdbc:postgresql://postgres:5432/notification_db
      - NOTIFICATION_DB_USERNAME=${NOTIFICATION_DB_USERNAME:-postgres}
      - NOTIFICATION_DB_PASSWORD=${NOTIFICATION_DB_PASSWORD:-password}

  # ─── 외부 API 래핑 서비스 (네이버 쇼핑 등) ────────────────
  external-api-service:
    build:
      context: ./external-api-service
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      # 모킹 모드: 기본값은 false(실제 API 호출). 필요 시 true로 설정하여 고정 데이터 반환
      - NAVER_MOCK_ENABLED=${NAVER_MOCK_ENABLED:-false}
      # AliExpress 모킹 모드: 기본값은 false(실제 API 호출). 필요 시 true로 설정하여 고정 데이터 반환
      - ALIEXPRESS_MOCK_ENABLED=${ALIEXPRESS_MOCK_ENABLED:-false}
      - ALIEXPRESS_BASE_URL=${ALIEXPRESS_BASE_URL:-https://api-sg.aliexpress.com/sync}
      # OpenAI 모킹 모드: 기본값은 false(실제 API 호출). 필요 시 true로 설정하여 고정 데이터 반환
      - OPENAI_MOCK_ENABLED=${OPENAI_MOCK_ENABLED:-false}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.4-mini}
      - VISION_DEBUG_DIR=/app/vision-debug
    volumes:
      - ./vision-debug:/app/vision-debug

volumes:
  postgres_data:

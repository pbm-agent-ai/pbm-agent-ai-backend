services:
  # ─── 인프라 ────────────────────────────────────────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-password}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped

  # ─── 서비스 디스커버리 ────────────────────────────────────
  eureka-server:
    image: ${DOCKERHUB_USERNAME}/pbm-eureka-server:latest
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    restart: unless-stopped

  # ─── API 게이트웨이 ───────────────────────────────────────
  gateway:
    image: ${DOCKERHUB_USERNAME}/pbm-gateway:latest
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped

  # ─── 인증 서비스 ──────────────────────────────────────────
  auth-service:
    image: ${DOCKERHUB_USERNAME}/pbm-auth-service:latest
    depends_on:
      - postgres
      - redis
      - eureka-server
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - AUTH_DB_URL=jdbc:postgresql://postgres:5432/auth_db
      - AUTH_DB_USERNAME=${AUTH_DB_USERNAME:-postgres}
      - AUTH_DB_PASSWORD=${AUTH_DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-1800000}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-604800000}
    restart: unless-stopped

  # ─── 커맨드 서비스 ────────────────────────────────────────
  command-service:
    image: ${DOCKERHUB_USERNAME}/pbm-command-service:latest
    depends_on:
      - kafka
      - eureka-server
      - redis
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EXTERNAL_API_SERVICE_URL=http://external-api-service:8090
      - COMMAND_DB_URL=jdbc:postgresql://postgres:5432/command_db
      - COMMAND_DB_USERNAME=${COMMAND_DB_USERNAME:-postgres}
      - COMMAND_DB_PASSWORD=${COMMAND_DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_DEVICE_EXPIRATION=${JWT_DEVICE_EXPIRATION:-2592000000}
      - JWT_AGENT_EXPIRATION=${JWT_AGENT_EXPIRATION:-1800000}
    restart: unless-stopped

  # ─── 가격 서비스 ──────────────────────────────────────────
  price-service:
    image: ${DOCKERHUB_USERNAME}/pbm-price-service:latest
    depends_on:
      - kafka
      - eureka-server
      - external-api-service
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EXTERNAL_API_SERVICE_URL=http://external-api-service:8090
      - PRICE_DB_URL=jdbc:postgresql://postgres:5432/price_db
      - PRICE_DB_USERNAME=${PRICE_DB_USERNAME:-postgres}
      - PRICE_DB_PASSWORD=${PRICE_DB_PASSWORD}
      - EXCHANGE_RATE_API_KEY=${EXCHANGE_RATE_API_KEY}
    restart: unless-stopped

  # ─── 결제 서비스 ──────────────────────────────────────────
  payment-service:
    image: ${DOCKERHUB_USERNAME}/pbm-payment-service:latest
    depends_on:
      - kafka
      - eureka-server
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PAYMENT_DB_URL=jdbc:postgresql://postgres:5432/payment_db
      - PAYMENT_DB_USERNAME=${PAYMENT_DB_USERNAME:-postgres}
      - PAYMENT_DB_PASSWORD=${PAYMENT_DB_PASSWORD}
    restart: unless-stopped

  # ─── 알림 서비스 ──────────────────────────────────────────
  notification-service:
    image: ${DOCKERHUB_USERNAME}/pbm-notification-service:latest
    depends_on:
      - kafka
      - eureka-server
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    restart: unless-stopped

  # ─── 외부 API 래핑 서비스 ────────────────────────────────
  external-api-service:
    image: ${DOCKERHUB_USERNAME}/pbm-external-api-service:latest
    depends_on:
      - eureka-server
    environment:
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - NAVER_MOCK_ENABLED=${NAVER_MOCK_ENABLED:-false}
      - ALIEXPRESS_APP_KEY=${ALIEXPRESS_APP_KEY}
      - ALIEXPRESS_APP_SECRET=${ALIEXPRESS_APP_SECRET}
      - ALIEXPRESS_BASE_URL=${ALIEXPRESS_BASE_URL:-https://api-sg.aliexpress.com/sync}
      - ALIEXPRESS_MOCK_ENABLED=${ALIEXPRESS_MOCK_ENABLED:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_MOCK_ENABLED=${OPENAI_MOCK_ENABLED:-false}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped

volumes:
  postgres_data:

server:
  port: 8082

spring:
  application:
    name: command-service

  # command-sessions 테이블 접근을 위해 JPA 자동 설정을 활성화한다.
  # datasource/jpa 설정은 아래에서 환경변수로 주입받는다.
  datasource:
    url: ${COMMAND_DB_URL}
    username: ${COMMAND_DB_USERNAME}
    password: ${COMMAND_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false   # SQL 로그 비활성화 (필요 시 true로 변경)
    properties:
      hibernate:
        format_sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: command-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

app:
  kafka:
    topics:
      price-topic: price-topic  # Java 파일에 토픽명을 하드코딩하지 않기 위해 설정으로 분리
      product-selection-required-topic: product-selection-required
      product-selection-topic: product-selection
      price-validation-result-topic: price-validation-result

proxy:
  base-url: ${EXTERNAL_API_SERVICE_URL:http://127.0.0.1:8090}
  connect-timeout-ms: 3000
  read-timeout-ms: 25000

jwt:
  secret: ${JWT_SECRET}
  device-expiration: ${JWT_DEVICE_EXPIRATION:2592000000} # 30일
  agent-expiration: ${JWT_AGENT_EXPIRATION:1800000}      # 30분

browser-agent:
  stale-threshold-seconds: ${BROWSER_AGENT_STALE_THRESHOLD_SECONDS:90}
  offline-check-fixed-delay-ms: ${BROWSER_AGENT_OFFLINE_CHECK_FIXED_DELAY_MS:30000}
  approval-timeout-minutes: ${BROWSER_AGENT_APPROVAL_TIMEOUT_MINUTES:10}
  approval-expire-fixed-delay-ms: ${BROWSER_AGENT_APPROVAL_EXPIRE_FIXED_DELAY_MS:60000}

resilience4j:
  circuitbreaker:
    instances:
      openAiProxyService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      openAiProxyService:
        maxAttempts: 1
        waitDuration: 1s
        retryExceptions:
          - org.springframework.web.client.RestClientException
          - com.pbm.command.exception.OpenAiClientException

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# 로깅 레벨 설정
logging:
  level:
    # 비즈니스 로직 디버그 (external-api-service 호출 추적)
    com.pbm.command: INFO
    # HTTP 클라이언트: WARN으로 설정 (DEBUG 시 Eureka wire 로그 폭탄 발생)
    org.apache.hc.client5: WARN
    org.springframework.web.client: WARN
    # Eureka 통신 로그 억제
    com.netflix.discovery: WARN
    # Hibernate SQL 로그 억제 (show-sql: false 와 함께 사용)
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

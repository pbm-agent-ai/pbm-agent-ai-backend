// price-service 빌드 설정
// 공통 의존성(web, jpa, lombok, postgres)은 루트 build.gradle에서 상속

dependencies {
    // Swagger UI / OpenAPI 문서 자동 생성
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // 네이버 쇼핑 API 등 외부 API 호출 시 JSON 파싱용
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // WebClient (external-api-service 호출용, 비동기 논블로킹 HTTP 클라이언트)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Eureka Server에 자신의 존재를 등록하고, 다른 MSA 주소를 찾기 위한 클라이언트 모듈
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    // Resilience4j: 외부 API 호출 장애 격리(Circuit Breaker), 재시도(Retry) 보호
    // spring-cloud-starter-circuitbreaker-resilience4j는 resilience4j-spring-boot3를 포함하여
    // @CircuitBreaker, @Retry 등의 어노테이션 기반 장애 제어를 지원한다
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

    // AOP: @CircuitBreaker, @Retry 등의 Resilience4j 어노테이션을 위한 AspectJ 지원
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // JPA 테스트 시 메모리 DB(H2)를 사용하여 실제 DB 없이도 저장 로직 검증 가능
    testRuntimeOnly 'com.h2database:h2'
}
